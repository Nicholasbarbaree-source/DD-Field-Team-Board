<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Interview Scorecard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F6F3;
  --surface:#FFFFFF;
  --surface-2:#ECEEEA;
  --ink:#1B2430;
  --ink-muted:#5B6472;
  --ink-faint:#8A9199;
  --line:#DBE0DA;
  --navy:#22364F;
  --navy-dark:#16222F;
  --navy-soft:#E7EBF0;
  --amber:#C97A0C;
  --amber-soft:#FBEBD1;
  --green:#2F7D5D;
  --green-soft:#E1F0E7;
  --red:#B33A3A;
  --red-soft:#F6E2E0;
  --radius-sm:6px;
  --radius-md:10px;
  --sidebar-w:288px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,.headline{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
textarea,input,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c7ccc6;border-radius:4px;}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--navy-dark);color:#DDE3E8;
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .logo-row{display:flex;align-items:baseline;gap:8px;}
.brand h1{font-size:18px;margin:0;color:#fff;font-weight:600;letter-spacing:.2px;}
.brand .tag{font-size:11px;color:#9FB0BE;margin-top:4px;}
.brand .scope-note{margin-top:10px;font-size:11px;color:#8FA0AD;background:rgba(255,255,255,.06);padding:6px 8px;border-radius:var(--radius-sm);line-height:1.4;}

.sidebar-actions{padding:14px 16px 8px;}
.btn-new{
  width:100%;background:var(--amber);color:#231604;border:none;
  padding:10px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-new:hover{background:#D98915;}

.search-box{padding:8px 16px 10px;}
.search-box input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#EAEDEE;padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;
}
.search-box input::placeholder{color:#7C8B96;}

.candidate-list{flex:1;overflow-y:auto;padding:4px 10px 16px;}
.cand-card{
  padding:10px 10px;border-radius:var(--radius-sm);margin-bottom:4px;cursor:pointer;
  border:1px solid transparent;
}
.cand-card:hover{background:rgba(255,255,255,.06);}
.cand-card.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);}
.cand-card .name{font-weight:600;color:#fff;font-size:13.5px;}
.cand-card .meta{font-size:11px;color:#8FA0AD;margin-top:2px;}
.cand-card .chips{display:flex;gap:6px;margin-top:7px;}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:100px;
  font-weight:600;
}
.chip.pending{background:rgba(255,255,255,.08);color:#8FA0AD;}
.chip.low{background:var(--red-soft);color:var(--red);}
.chip.mid{background:var(--amber-soft);color:#8A550A;}
.chip.high{background:var(--green-soft);color:var(--green);}
.empty-roster{color:#77848F;font-size:12.5px;padding:20px 10px;text-align:center;}

.backup-row{display:flex;gap:8px;padding:0 16px 12px;}
.backup-row button{
  flex:1;background:none;border:1px solid rgba(255,255,255,.14);color:#AEBBC4;
  padding:6px 8px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;
}
.backup-row button:hover{border-color:rgba(255,255,255,.3);color:#fff;}
.backup-note{font-size:10.5px;color:#77848F;padding:0 16px 10px;line-height:1.4;}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:18px 28px;position:sticky;top:0;z-index:5;
}
.id-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.field-group{display:flex;flex-direction:column;gap:3px;}
.field-group label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;}
.field-group input{
  border:none;border-bottom:2px solid var(--line);padding:4px 2px;font-size:15px;
  background:transparent;color:var(--ink);min-width:160px;font-family:'Space Grotesk',sans-serif;font-weight:600;
}
.field-group input:focus{outline:none;border-bottom-color:var(--amber);}
.field-group.small input{font-size:13px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;min-width:130px;}
.pt-link-group{min-width:220px;flex:1 1 240px;}
.pt-link-group input{font-size:13px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;width:100%;min-width:200px;}
.pt-link-view{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:2px solid transparent;}
.pt-link-view a{
  color:var(--navy);font-size:13px;font-weight:500;text-decoration:underline;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;
}
.pt-link-view a:hover{color:var(--amber);}
.pt-clear-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);
  border-radius:100px;width:20px;height:20px;font-size:11px;line-height:1;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.pt-clear-btn:hover{border-color:var(--red);color:var(--red);}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-self:flex-end;}
.icon-btn{
  background:none;border:1px solid var(--line);color:var(--ink-muted);border-radius:var(--radius-sm);
  padding:7px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{border-color:var(--ink-muted);color:var(--ink);}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red);}
.icon-btn.danger.confirming{background:var(--red);color:#fff;border-color:var(--red);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--navy-dark);color:#fff;padding:11px 14px 11px 18px;border-radius:var(--radius-sm);
  font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:100;max-width:420px;text-align:center;
  opacity:0;transition:opacity .2s ease;pointer-events:none;
  display:flex;align-items:center;gap:12px;
}
.toast.show{opacity:1;pointer-events:auto;}
.toast-action{
  background:var(--amber);color:#231604;border:none;padding:5px 11px;border-radius:100px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}

.round-tabs{display:flex;gap:6px;margin-top:16px;}
.round-tab{
  padding:9px 16px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;border:1px solid var(--line);
  border-bottom:none;background:var(--surface-2);color:var(--ink-muted);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:8px;position:relative;top:1px;
}
.round-tab.active{background:var(--surface);color:var(--ink);border-color:var(--line);}
.round-tab .score-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 7px;border-radius:100px;background:var(--surface);}
.round-tab.active .score-pill{background:var(--bg);}

.content{padding:22px 28px 100px;flex:1;}
.mode-switch{display:inline-flex;background:var(--surface-2);border-radius:100px;padding:3px;margin-bottom:18px;}
.mode-switch button{
  border:none;background:none;padding:7px 16px;border-radius:100px;font-size:12.5px;font-weight:600;color:var(--ink-muted);
}
.mode-switch button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}

.category{margin-bottom:26px;}
.category-title{
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--navy);
  text-transform:uppercase;letter-spacing:.05em;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.question-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:14px 16px;margin-bottom:10px;
}
.question-row .q-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.question-row .q-text{font-size:13.8px;font-weight:500;color:var(--ink);max-width:640px;}
.question-row .q-helper{font-size:12px;color:var(--ink-muted);margin-top:3px;}
.ai-badge{
  font-size:10px;font-weight:600;color:#8A550A;background:var(--amber-soft);padding:2px 7px;
  border-radius:100px;white-space:nowrap;flex:0 0 auto;
}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.pill{
  border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:100px;
  font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:7px;max-width:340px;
}
.pill:hover{border-color:var(--navy);}
.pill .s{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink-faint);font-size:11px;}
.pill.selected{background:var(--navy);color:#fff;border-color:var(--navy);}
.pill.selected .s{color:#BFD0E0;}
.notes-field{margin-top:10px;}
.notes-field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;
  font-size:12.8px;color:var(--ink);resize:vertical;min-height:38px;background:var(--bg);
}
.notes-field textarea:focus{outline:none;border-color:var(--navy);background:var(--surface);}
.notes-field .nf-label{font-size:10.5px;color:var(--ink-faint);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}

.transcript-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px;}
.transcript-panel h3{margin:0 0 4px;font-size:15px;}
.transcript-panel p.hint{color:var(--ink-muted);font-size:12.5px;margin:0 0 14px;max-width:560px;}
.transcript-panel textarea{
  width:100%;min-height:220px;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px;font-size:12.8px;font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);
}
.transcript-panel textarea:focus{outline:none;border-color:var(--navy);}
.context-field{margin-top:12px;}
.context-field textarea{min-height:60px;font-family:'IBM Plex Sans',sans-serif;}
.generate-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
.btn-primary{
  background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;
}
.btn-primary:hover{background:var(--navy-dark);}
.btn-primary:disabled{opacity:.55;cursor:default;}
.gen-status{font-size:12.5px;color:var(--ink-muted);}
.gen-status.err{color:var(--red);}
.spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-summary{
  margin-top:16px;border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 12px;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12.8px;color:#5B3F0A;
}

.footer-bar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 28px;display:flex;align-items:center;gap:16px;
}
.score-meter{flex:1;max-width:420px;}
.score-meter .labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted);margin-bottom:4px;}
.score-meter .track{height:8px;background:var(--surface-2);border-radius:100px;overflow:hidden;}
.score-meter .fill{height:100%;border-radius:100px;transition:width .3s ease;}
.save-status{font-size:11.5px;color:var(--ink-faint);margin-left:auto;display:flex;align-items:center;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

.empty-state{padding:70px 40px;text-align:center;color:var(--ink-muted);}
.empty-state h2{color:var(--ink);font-size:20px;margin-bottom:8px;}
.empty-state button{margin-top:14px;}

@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  #app{display:block;}
  .main{height:auto;}
  .topbar{padding:16px 16px;}
  .content{padding:18px 16px 90px;}
  .footer-bar{padding:10px 16px;flex-wrap:wrap;}
}

@media print{
  .sidebar,.topbar-actions,.mode-switch,.footer-bar,.transcript-panel,.ai-badge{display:none !important;}
  body{background:#fff;}
  .question-row{border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   SCHEMA — mirrors the source Driver Interview Scorecard workbook
   ============================================================ */
const ROUND1 = [
  { category: "General Interest", items: [
    { id:"r1_interest", q:"What about this opportunity caught your attention?",
      options:[{l:"No strong reason, just because",s:1},{l:"Consistent schedule/pay",s:2},{l:"Wants to make a difference, etc.",s:3}] }
  ]},
  { category: "General Qualifications", items: [
    { id:"r1_location", q:"Where do you currently reside? What is your home zip code?",
      options:[{l:"100+ miles from warehouse",s:0},{l:"50-99 miles from warehouse",s:1},{l:"25-49 miles from warehouse",s:2},{l:"15-24 miles from warehouse",s:3},{l:"0-14 miles from warehouse",s:4}] },
    { id:"r1_vehicle_year", q:"What is the year of your vehicle?",
      options:[{l:"Older than 2015",s:0},{l:"2015-2017",s:1},{l:"2018-2020",s:2},{l:"2021-Newer",s:3}] },
    { id:"r1_vehicle_size", q:"What model cargo van do you have? Is it a high roof?",
      options:[{l:"No cargo van",s:0},{l:"Small cargo van",s:1},{l:"Sprinter van",s:2},{l:"Large/high roof cargo van",s:3}] },
    { id:"r1_vehicle_condition", q:"What steps do you take to ensure your vehicle remains clean, organized, and ready for use?",
      options:[{l:"Rarely maintained; interior dirty, damaged, or cluttered",s:1},{l:"Maintained as needed; typical wear, no major issues",s:2},{l:"Regularly maintained; excellent condition, shows pride of ownership",s:3}] },
    { id:"r1_vehicle_gas", q:"Does your van require regular gas or diesel?", freeOnly:true, helper:"Tracking only — no score." },
    { id:"r1_backup_vehicle", q:"Do you have a secondary vehicle? If so, what type?",
      options:[{l:"No additional vehicle",s:0},{l:"Additional car",s:1},{l:"Additional SUV",s:2},{l:"Additional mini van",s:3},{l:"Additional cargo van",s:4}] },
    { id:"r1_vehicle_requirements", q:"Does the vehicle type meet the customer requirements?",
      options:[{l:"No",s:0},{l:"Yes",s:4}] },
    { id:"r1_lifting", q:"Are you able to lift packages up to 50lb with or without accommodation?",
      options:[{l:"No",s:0},{l:"Maybe — unsure about consistently lifting 50lb daily",s:1},{l:"Yes",s:3}] },
    { id:"r1_handcart", q:"Do you own a handcart to use for deliveries?",
      options:[{l:"No",s:0},{l:"Yes",s:1}] },
    { id:"r1_warehouse", q:"Are you willing and able to support the warehouse during any downtime?",
      options:[{l:"Unwilling to support warehouse",s:1},{l:"Some willingness to support warehouse",s:2},{l:"Fully willing and able to support the warehouse",s:3}] },
    { id:"r1_smartphone", q:"Have you previously used smartphone apps or other tech for work?", helper:"Drivers use the Airspace app daily and it updates often — we want someone adaptable to changing tech.",
      options:[{l:"No previous smartphone/app experience",s:1},{l:"Limited experience, not very tech savvy",s:2},{l:"Confident using smartphones and apps",s:3}] }
  ]},
  { category: "Driving Experience", items: [
    { id:"r1_years_commercial", q:"How long have you been in the courier business?", helper:"If an Airspace driver — ask for details on commodities handled, past customers, etc.",
      options:[{l:"0-2 years",s:1},{l:"2-5 years",s:2},{l:"5-10 years",s:3},{l:"10+ years",s:4}] },
    { id:"r1_medical_delivery", q:"Do you have experience delivering to hospitals, or navigating within a hospital (non-front-desk deliveries)?",
      options:[{l:"No prior experience",s:1},{l:"Some experience",s:2},{l:"Years of experience",s:3}] },
    { id:"r1_general_delivery", q:"If no hospital experience, do you have other delivery experience — medical or non-medical?",
      options:[{l:"No prior experience",s:1},{l:"Prior non-medical delivery experience",s:2},{l:"Prior medical delivery, but not to hospitals",s:3},{l:"Delivered to hospitals and navigated hospital settings",s:4}] }
  ]},
  { category: "Availability", items: [
    { id:"r1_restrictions", q:"Explain the start timeline to the driver. Does it work for them? Do they need to give notice to a current job first?", freeOnly:true },
    { id:"r1_downtime", q:"Do you have any planned days within the next six months that would require downtime (vacations, etc.)?", freeOnly:true }
  ]},
  { category: "Interview Engagement — rate after the call", items: [
    { id:"r1_timeliness", q:"Rate the candidate's timeliness. Were they punctual, or did they communicate about delays before joining?",
      options:[{l:"More than 5 min late",s:1},{l:"Under 5 min late",s:2},{l:"Early / on-time",s:3}] },
    { id:"r1_engagement", q:"Rate the candidate's engagement — attentive, active listening, relevant responses, asked questions?",
      options:[{l:"Distracted, short responses, disengaged",s:1},{l:"Generally attentive and responsive",s:2},{l:"Active listening, asked relevant questions",s:3}] },
    { id:"r1_tech", q:"Rate the candidate's use of tech during the call.",
      options:[{l:"Joined late due to tech issues",s:1},{l:"General tech competence, minor issue",s:2},{l:"Joined on time, demonstrated good technical skills",s:3}] }
  ]},
  { category: "Additional Notes", items: [
    { id:"r1_additional_notes", q:"Additional notes", freeOnly:true }
  ]}
];

const ROUND2 = [
  { category: "Operational Skills and Knowledge", items: [
    { id:"r2_route", q:"Tell me about a time your planned route got thrown off — traffic, a road closure, a last-minute schedule change. What did you do, and how did the delivery ultimately turn out?",
      options:[{l:"Weak — no real example, blames others, no tools/process mentioned, or delivery was significantly impacted with no recovery effort",s:1},{l:"Adequate — vague or secondhand example; reactive but no proactive habits mentioned; outcome just okay",s:2},{l:"Strong — specific real example; takes ownership of the reroute; names concrete tools/habits; delivery still landed on time or close to it",s:3}] },
    { id:"r2_route_prevention", q:"What tools do you rely on to plan routes and catch problems before they happen?",
      options:[{l:"Weak — no real process or no tools mentioned at all",s:1},{l:"Adequate — mentions only basic navigation, reactive rather than proactive",s:2},{l:"Strong — names specific tools/habits used proactively",s:3}] },
    { id:"r2_midroute_change", q:"If a delivery update or pickup change comes through the app mid-route, what's your process for handling it?",
      options:[{l:"Weak — describes confusion, ignoring updates, or no real plan for adjusting",s:1},{l:"Adequate — handles it but no clear repeatable process; somewhat reactive",s:2},{l:"Strong — calm, specific process: acknowledges the change, re-sequences the route, communicates with team/customer if needed",s:3}] },
    { id:"r2_app_proficiency", q:"Airspace deliveries are managed through a mobile app — how comfortable are you using smartphone-based platforms to receive jobs, scan items, and confirm deliveries?",
      options:[{l:"Weak — little to no smartphone/app experience, or expresses discomfort/resistance to using tech daily",s:1},{l:"Adequate — general comfort with smartphones, limited work-app experience, but willing to learn",s:2},{l:"Strong — confident, cites specific past app/tech use for work; comfortable adapting to regular app updates",s:3}] }
  ]},
  { category: "Customer Service and Communication", items: [
    { id:"r2_communication", q:"Tell me about a time you had to manage a delay or issue that affected a customer — walk me through how you communicated with your team or coordinator, how you handled the conversation with the customer, and how it got resolved.",
      options:[{l:"Weak — no mention of looping in team; describes getting defensive or flustered with customer; no real resolution",s:1},{l:"Adequate — communicates but reactively/late; customer handled okay but light on specifics; resolution unclear",s:2},{l:"Strong — proactively loops in team/coordinator before it escalates; stays calm and professional with customer; clear resolution",s:3}] },
    { id:"r2_attention", q:"What steps do you take to make sure you have all the details right — on a delivery, paperwork, or instructions — before something becomes a problem?",
      options:[{l:"Weak — no real process described, or relies on others to catch mistakes",s:1},{l:"Adequate — general answer (\"I just pay attention\") with no concrete process",s:2},{l:"Strong — specific, repeatable process (checklist, double-checking paperwork, confirming details upfront); clearly a habit",s:3}] }
  ]},
  { category: "Reliability", items: [
    { id:"r2_reliability", q:"Tell me about a time something happened that could have made you late or caused you to miss a shift. How did you handle it, and how did you make sure the job still got done?",
      options:[{l:"Weak — no real example, no ownership, or describes not showing up / not communicating",s:1},{l:"Adequate — thin or hypothetical example; handled it but communication was late or minimal",s:2},{l:"Strong — real example of an obstacle to being on time/present; proactive communication and problem-solving; shift/job still got done",s:3}] }
  ]},
  { category: "Confidence & Alignment with Role Expectations — only worry about this if you like the candidate", items: [
    { id:"r2_expectations", q:"Confirm the candidate understands and is comfortable with these realities before moving forward: mileage varies day to day depending on route and volume (no fixed number), the pay range for the role, and that this role supports the warehouse as needed.", freeOnly:true }
  ]},
  { category: "Interview Engagement — do not ask these, rate the candidate after the call", items: [
    { id:"r2_timeliness", q:"Rate the candidate's timeliness. Were they punctual, or did they communicate about delays before joining?",
      options:[{l:"More than 5 min late",s:1},{l:"Under 5 min late",s:2},{l:"Early / on-time",s:3}] },
    { id:"r2_appearance", q:"Rate the candidate's general appearance — appropriate/professional for the interview? Background noisy or disruptive?",
      options:[{l:"No camera",s:1},{l:"Dressed casually",s:2},{l:"Dressed professionally",s:3}] },
    { id:"r2_engagement", q:"Rate the candidate's engagement — attentive, active listening, relevant responses, asked questions?",
      options:[{l:"Distracted, short responses, disengaged",s:1},{l:"Generally attentive and responsive",s:2},{l:"Active listening, asked relevant questions",s:3}] },
    { id:"r2_tech", q:"Rate the candidate's use of tech, including setup/familiarity with Google Meet, to ensure a smooth and professional interview experience.",
      options:[{l:"Joined late due to tech, unfamiliar with mute/unmute, video on",s:1},{l:"General tech competence, occasional/minor tech issue",s:2},{l:"Joined early/on-time, on video, demonstrates good technical skills",s:3}] }
  ]},
  { category: "Recap of Notes", items: [
    { id:"r2_summary_notes", q:"Recap of notes", freeOnly:true }
  ]}
];

const ROUND_META = {
  1: { label:"Round 1 · Recruiter screen", short:"Round 1", schema:ROUND1 },
  2: { label:"Round 2 · Regional manager", short:"Round 2", schema:ROUND2 }
};

/* ============================================================
   STATE
   ============================================================ */
let candidates = [];
let activeId = null;
let activeRound = 1;
let roundMode = { 1:"manual", 2:"manual" };
let saveTimer = null;
let searchQuery = "";
let genState = { 1:{busy:false,error:null}, 2:{busy:false,error:null} };
let ptEditing = false;

function uid(){ return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }

function blankRound(){ return { scores:{}, notes:{}, aiFields:{}, aiSummary:null }; }
function blankCandidate(){
  return {
    id: uid(), name:"", date:"", region:"", ptProfileLink:"",
    createdAt: Date.now(), updatedAt: Date.now(),
    r1: blankRound(), r2: blankRound()
  };
}

/* ============================================================
   PERSISTENCE — shared so any regional manager sees the roster
   ============================================================ */
const STORAGE_KEY = "dd-interview-scorecard-candidates";

function persistCandidates() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(candidates));
}

async function loadCandidates() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    candidates = saved ? JSON.parse(saved) : [];
  } catch (error) {
    console.error("Could not load scorecards:", error);
    candidates = [];
  }

  candidates.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  render();
}

async function saveIndex() {
  persistCandidates();
}

function scheduleSave(candidate) {
  candidate.updatedAt = Date.now();

  clearTimeout(saveTimer);
  setSaveStatus("saving");

  saveTimer = setTimeout(() => {
    try {
      persistCandidates();
      setSaveStatus("saved");
    } catch (error) {
      console.error("Could not save scorecard:", error);
      setSaveStatus("error");
    }
  }, 450);
}
function setSaveStatus(status){
  const el = document.getElementById("save-status-text");
  const dot = document.getElementById("save-status-dot");
  if(!el||!dot) return;
  if(status==="saving"){ el.textContent="Saving…"; dot.style.background="var(--amber)"; }
  else if(status==="saved"){ el.textContent="Saved"; dot.style.background="var(--green)"; }
  else { el.textContent="Couldn't save"; dot.style.background="var(--red)"; }
}
  function handleImportFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed)
        ? parsed
        : parsed.candidates;

      if (!Array.isArray(incoming)) {
        throw new Error("Invalid scorecard backup format.");
      }

      const existingIds = new Set(candidates.map(c => c.id));
      let added = 0;
      let skipped = 0;

      for (const importedCandidate of incoming) {
        if (!importedCandidate || !importedCandidate.id) {
          continue;
        }

        if (existingIds.has(importedCandidate.id)) {
          skipped++;
          continue;
        }

        candidates.push(importedCandidate);
        existingIds.add(importedCandidate.id);
        added++;
      }

      candidates.sort(
        (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)
      );

      persistCandidates();

      if (!activeId && candidates.length) {
        activeId = candidates[0].id;
      }

      render();

      showToast(
        `Imported ${added} candidate${added === 1 ? "" : "s"}.` +
        (skipped
          ? ` Skipped ${skipped} already in this roster.`
          : "")
      );
    } catch (error) {
      console.error("Import failed:", error);
      showToast(
        "Could not import that file. Please choose a JSON backup exported from this scorecard."
      );
    } finally {
      ev.target.value = "";
    }
  };

  reader.onerror = () => {
    showToast("Could not read the selected file.");
    ev.target.value = "";
  };

  reader.readAsText(file);
}

/* ============================================================
   SCORING HELPERS
   ============================================================ */
function roundMax(schema){
  let max=0;
  schema.forEach(cat=>cat.items.forEach(it=>{ if(it.options) max += Math.max(...it.options.map(o=>o.s)); }));
  return max;
}
function roundTotal(roundData, schema){
  let total=0;
  schema.forEach(cat=>cat.items.forEach(it=>{
    if(it.options){
      const v = roundData.scores[it.id];
      if(v!==undefined && v!==null) total += v;
    }
  }));
  return total;
}
function pctBand(pct){
  if(pct>=75) return "high";
  if(pct>=50) return "mid";
  return "low";
}

/* ============================================================
   RENDER — sidebar
   ============================================================ */
function filteredCandidates(){
  const q = (searchQuery||"").trim().toLowerCase();
  if(!q) return candidates;
  return candidates.filter(c=>
    (c.name||"").toLowerCase().includes(q) || (c.region||"").toLowerCase().includes(q)
  );
}

function renderCandidateCards(){
  const list = filteredCandidates();
  if(!list.length){
    return searchQuery
      ? `<div class="empty-roster">No candidates match "${escapeHtml(searchQuery)}".</div>`
      : `<div class="empty-roster">No candidates yet.<br>Add one to get started.</div>`;
  }
  return list.map(c=>{
    const r1max = roundMax(ROUND1), r2max = roundMax(ROUND2);
    const r1t = roundTotal(c.r1, ROUND1), r2t = roundTotal(c.r2, ROUND2);
    const r1Started = Object.keys(c.r1.scores).length>0;
    const r2Started = Object.keys(c.r2.scores).length>0;
    const r1chip = r1Started ? `<span class="chip ${pctBand(100*r1t/r1max)}">R1 ${r1t}/${r1max}</span>` : `<span class="chip pending">R1 —</span>`;
    const r2chip = r2Started ? `<span class="chip ${pctBand(100*r2t/r2max)}">R2 ${r2t}/${r2max}</span>` : `<span class="chip pending">R2 —</span>`;
    return `<div class="cand-card ${c.id===activeId?'active':''}" data-id="${c.id}">
      <div class="name">${escapeHtml(c.name) || "Unnamed candidate"}</div>
      <div class="meta">${escapeHtml(c.region)||"No region set"}${c.date?" · "+escapeHtml(c.date):""}</div>
      <div class="chips">${r1chip}${r2chip}</div>
    </div>`;
  }).join("");
}

function renderSidebar(){
  return `
    <div class="brand">
      <div class="logo-row"><h1>Driver Scorecard</h1></div>
      <div class="tag">Airspace interview evaluation</div>
      <div class="scope-note">Live updated roster — visible to all DD team members using this tool.</div>
    </div>
    <div class="sidebar-actions"><button class="btn-new" id="new-candidate-btn">+ New candidate</button></div>
    <div class="backup-row">
      <button id="export-btn" type="button">Export backup</button>
      <button id="import-btn" type="button">Import backup</button>
    </div>
    <input type="file" id="import-file-input" accept="application/json" style="display:none;">
    <div class="backup-note">If a new link ever starts empty, export from the old one and import here to bring your candidates over.</div>
    <div class="search-box"><input id="search-input" type="text" placeholder="Search name or region…" value="${escapeAttr(searchQuery)}"></div>
    <div class="candidate-list" id="candidate-list">${renderCandidateCards()}</div>
  `;
}

/* ============================================================
   RENDER — question row
   ============================================================ */
function renderQuestion(item, roundData, roundNum){
  const isAi = !!roundData.aiFields[item.id];
  const notesVal = roundData.notes[item.id] || "";
  let optionsHtml = "";
  if(item.options){
    optionsHtml = `<div class="pill-row">` + item.options.map(o=>{
      const sel = roundData.scores[item.id] === o.s;
      return `<button class="pill ${sel?'selected':''}" data-role="score" data-item="${item.id}" data-round="${roundNum}" data-score="${o.s}" title="${escapeHtml(o.l)}">
        <span class="s">${o.s}</span><span>${escapeHtml(o.l)}</span>
      </button>`;
    }).join("") + `</div>`;
  }
  return `
    <div class="question-row" data-qid="${item.id}">
      <div class="q-head">
        <div>
          <div class="q-text">${escapeHtml(item.q)}</div>
          ${item.helper?`<div class="q-helper">${escapeHtml(item.helper)}</div>`:""}
        </div>
        ${isAi ? `<span class="ai-badge">AI suggested · review</span>` : ""}
      </div>
      ${optionsHtml}
      <div class="notes-field">
        <span class="nf-label">Interviewer notes</span>
        <textarea data-role="notes" data-item="${item.id}" data-round="${roundNum}" placeholder="What did the driver say?">${escapeHtml(notesVal)}</textarea>
      </div>
    </div>
  `;
}

function renderCategoryBlock(schema, roundData, roundNum){
  return schema.map(cat=>`
    <div class="category">
      <div class="category-title">${escapeHtml(cat.category)}</div>
      ${cat.items.map(it=>renderQuestion(it, roundData, roundNum)).join("")}
    </div>
  `).join("");
}

/* ============================================================
   RENDER — transcript panel
   ============================================================ */
function renderTranscriptPanel(roundNum){
  const gs = genState[roundNum];
  return `
    <div class="transcript-panel">
      <h3>Generate this round from a transcript</h3>
      <p class="hint">Paste the Google Meet transcript below. Claude will read the driver's answers against the round ${roundNum} rubric, draft a rating for each scored question, and summarize the notes. Nothing saves until you review it — every drafted field is flagged for your check.</p>
      <textarea id="transcript-input-${roundNum}" placeholder="Paste the interview transcript here…"></textarea>
      <div class="context-field">
        <span class="nf-label">Anything else worth factoring in? (optional)</span>
        <textarea id="context-input-${roundNum}" placeholder="e.g. driver seemed nervous on camera but answered clearly, arrived 10 min early, etc."></textarea>
      </div>
      <div class="generate-row">
        <button class="btn-primary" id="generate-btn-${roundNum}" ${gs.busy?"disabled":""}>
          ${gs.busy?`<span class="spinner"></span> Generating…`:"Generate scorecard"}
        </button>
        <span class="gen-status ${gs.error?'err':''}">${gs.error||""}</span>
      </div>
      ${roundActiveCandidate() && roundActiveCandidate()[roundKey(roundNum)].aiSummary ? `<div class="ai-summary"><strong>AI summary:</strong> ${escapeHtml(roundActiveCandidate()[roundKey(roundNum)].aiSummary)}</div>` : ""}
    </div>
  `;
}

function roundKey(n){ return n===1 ? "r1" : "r2"; }
function roundActiveCandidate(){ return candidates.find(c=>c.id===activeId); }

/* ============================================================
   RENDER — main detail
   ============================================================ */
function renderPtLinkField(c){
  const link = (c.ptProfileLink || "").trim();
  if(link && !ptEditing){
    return `
      <div class="pt-link-view">
        <a href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(link)}">${escapeHtml(link)}</a>
        <button type="button" class="pt-clear-btn" id="pt-clear-btn" title="Clear link">✕</button>
      </div>`;
  }
  return `<input id="field-pt-link" type="text" placeholder="Paste PT profile URL" value="${escapeAttr(link)}">`;
}

function renderMain(){
  const c = roundActiveCandidate();
  if(!c){
    return `
      <div class="topbar"><div class="id-row"><h2 style="margin:0;font-size:16px;">Driver Interview Scorecard</h2></div></div>
      <div class="empty-state">
        <h2>No candidate selected</h2>
        <p>Create a new candidate to fill in a scorecard by hand, or generate one straight from an interview transcript.</p>
        <button class="btn-primary" id="empty-new-btn">+ New candidate</button>
      </div>
    `;
  }

  const meta = ROUND_META[activeRound];
  const roundData = c[roundKey(activeRound)];
  const max = roundMax(meta.schema);
  const total = roundTotal(roundData, meta.schema);
  const pct = max ? Math.round(100*total/max) : 0;
  const band = pctBand(pct);
  const fillColor = band==="high" ? "var(--green)" : band==="mid" ? "var(--amber)" : "var(--red)";

  const tabs = [1,2].map(n=>{
    const rd = c[roundKey(n)];
    const rmax = roundMax(ROUND_META[n].schema);
    const rt = roundTotal(rd, ROUND_META[n].schema);
    return `<div class="round-tab ${activeRound===n?'active':''}" data-round-tab="${n}">
      ${ROUND_META[n].short} <span class="score-pill mono">${rt}/${rmax}</span>
    </div>`;
  }).join("");

  const mode = roundMode[activeRound];
  const body = mode==="manual"
    ? renderCategoryBlock(meta.schema, roundData, activeRound)
    : renderTranscriptPanel(activeRound);

  return `
    <div class="topbar">
      <div class="id-row">
        <div class="field-group">
          <label>Driver name</label>
          <input id="field-name" type="text" placeholder="Full name" value="${escapeAttr(c.name)}">
        </div>
        <div class="field-group small">
          <label>Region</label>
          <input id="field-region" type="text" placeholder="e.g. Dallas" value="${escapeAttr(c.region)}">
        </div>
        <div class="field-group small">
          <label>Interview date</label>
          <input id="field-date" type="date" value="${escapeAttr(c.date)}">
        </div>
        <div class="field-group pt-link-group">
          <label>PT Profile Link (optional)</label>
          ${renderPtLinkField(c)}
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="print-btn">Print / export</button>
          <button class="icon-btn danger" id="delete-btn">Delete candidate</button>
        </div>
      </div>
      <div class="round-tabs">${tabs}</div>
    </div>
    <div class="content">
      <div class="mode-switch">
        <button class="${mode==='manual'?'active':''}" data-mode="manual">Fill manually</button>
        <button class="${mode==='transcript'?'active':''}" data-mode="transcript">Generate from transcript</button>
      </div>
      ${body}
    </div>
    <div class="footer-bar">
      <div class="score-meter">
        <div class="labels"><span>${meta.label}</span><span>${total} / ${max}</span></div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${fillColor};"></div></div>
      </div>
      <div class="save-status"><span class="dot" id="save-status-dot"></span><span id="save-status-text">Saved</span></div>
    </div>
  `;
}

/* ============================================================
   ESCAPES
   ============================================================ */
function escapeHtml(str){
  return (str||"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

let toastTimer = null;
function showToast(message, actionLabel, onAction){
  let el = document.getElementById("app-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "app-toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.innerHTML = "";
  const msgSpan = document.createElement("span");
  msgSpan.textContent = message;
  el.appendChild(msgSpan);
  if(actionLabel && onAction){
    const btn = document.createElement("button");
    btn.textContent = actionLabel;
    btn.className = "toast-action";
    btn.onclick = ()=>{ onAction(); el.classList.remove("show"); };
    el.appendChild(btn);
  }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove("show"); }, actionLabel ? 8000 : 3200);
}

/* ============================================================
   PRINT / EXPORT — build a standalone printable copy
   (window.print() is blocked inside this preview's sandbox, so we
   open a real, unsandboxed document and let it print itself.)
   ============================================================ */
function optionLabelFor(item, score){
  if(!item.options) return null;
  const opt = item.options.find(o=>o.s===score);
  return opt ? opt.l : null;
}

function buildPrintableHtml(c){
  const sectionsHtml = [1,2].map(n=>{
    const meta = ROUND_META[n];
    const rd = c[roundKey(n)];
    const max = roundMax(meta.schema);
    const total = roundTotal(rd, meta.schema);
    const cats = meta.schema.map(cat=>{
      const rows = cat.items.map(it=>{
        const score = rd.scores[it.id];
        const label = (score!==undefined) ? optionLabelFor(it, score) : null;
        const note = rd.notes[it.id] || "";
        if(!it.options && !note) return "";
        return `
          <div class="p-q">
            <div class="p-qtext">${escapeHtml(it.q)}</div>
            ${it.options ? `<div class="p-answer">${label ? escapeHtml(label) + " (score: " + score + ")" : "<em>Not answered</em>"}</div>` : ""}
            ${note ? `<div class="p-notes">${escapeHtml(note)}</div>` : ""}
          </div>`;
      }).join("");
      return rows ? `<div class="p-cat"><h3>${escapeHtml(cat.category)}</h3>${rows}</div>` : "";
    }).join("");
    return `
      <section class="p-round">
        <h2>${escapeHtml(meta.label)} — ${total} / ${max}</h2>
        ${cats || "<p><em>No responses recorded for this round.</em></p>"}
      </section>`;
  }).join("");

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${escapeHtml(c.name)||"Candidate"} — Interview Scorecard</title>
<style>
  body{font-family:'IBM Plex Sans',Arial,sans-serif;color:#1B2430;max-width:760px;margin:32px auto;padding:0 20px;}
  h1{font-size:22px;margin-bottom:2px;}
  .p-meta{color:#5B6472;font-size:13px;margin-bottom:20px;}
  .p-pt-link{font-size:12.5px;color:#444;margin:-12px 0 20px;}
  .p-pt-link a{color:#22364F;}
  h2{font-size:16px;border-bottom:2px solid #22364F;padding-bottom:6px;margin-top:32px;}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#22364F;margin-top:18px;margin-bottom:8px;}
  .p-q{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #E4E7E2;}
  .p-qtext{font-weight:600;font-size:13.5px;}
  .p-answer{font-size:13px;margin-top:3px;}
  .p-notes{font-size:12.5px;color:#444;margin-top:3px;font-style:italic;}
  @media print{ body{margin:0;padding:16px;} }
</style>
</head>
<body>
  <h1>${escapeHtml(c.name) || "Unnamed candidate"}</h1>
  <div class="p-meta">${escapeHtml(c.region)||"No region set"}${c.date ? " · Interviewed " + escapeHtml(c.date) : ""}</div>
  ${(c.ptProfileLink||"").trim() ? `<div class="p-pt-link">PT Profile: <a href="${escapeAttr(c.ptProfileLink.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.ptProfileLink.trim())}</a></div>` : ""}
  ${sectionsHtml}
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 250); };<\/script>
</body></html>`;
}

function exportPrintable(){
  const c = roundActiveCandidate();
  if(!c) return;
  const html = buildPrintableHtml(c);
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if(!win){
    const a = document.createElement("a");
    a.href = url;
    a.download = ((c.name || "candidate").trim().replace(/\s+/g,"_") || "candidate") + "_scorecard.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

/* ============================================================
   MAIN RENDER + EVENT BINDING
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  const prevMain = document.querySelector(".main");
  const prevScroll = prevMain ? prevMain.scrollTop : 0;
  const prevSidebarList = document.querySelector(".candidate-list");
  const prevSidebarScroll = prevSidebarList ? prevSidebarList.scrollTop : 0;

  app.innerHTML = `
    <div class="sidebar">${renderSidebar()}</div>
    <div class="main">${renderMain()}</div>
  `;
  bindEvents();

  const newMain = document.querySelector(".main");
  if(newMain) newMain.scrollTop = prevScroll;
  const newSidebarList = document.querySelector(".candidate-list");
  if(newSidebarList) newSidebarList.scrollTop = prevSidebarScroll;
}

function bindEvents(){
  const newBtn = document.getElementById("new-candidate-btn");
  if(newBtn) newBtn.onclick = createCandidate;
  const emptyNewBtn = document.getElementById("empty-new-btn");
  if(emptyNewBtn) emptyNewBtn.onclick = createCandidate;

  const exportBtn = document.getElementById("export-btn");
  if(exportBtn) exportBtn.onclick = exportBackup;
  const importBtn = document.getElementById("import-btn");
  const importFileInput = document.getElementById("import-file-input");
  if(importBtn && importFileInput){
    importBtn.onclick = ()=>importFileInput.click();
    importFileInput.onchange = handleImportFile;
  }

  const search = document.getElementById("search-input");
  if(search){
    search.oninput = ()=>{ searchQuery = search.value; refreshCandidateList(); };
  }

  document.querySelectorAll(".cand-card").forEach(el=>{
    el.onclick = ()=>{ activeId = el.dataset.id; activeRound = 1; ptEditing = false; render(); };
  });

  document.querySelectorAll("[data-round-tab]").forEach(el=>{
    el.onclick = ()=>{ activeRound = parseInt(el.dataset.roundTab,10); render(); };
  });

  document.querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick = ()=>{ roundMode[activeRound] = el.dataset.mode; render(); };
  });

  const nameF = document.getElementById("field-name");
  const regionF = document.getElementById("field-region");
  const dateF = document.getElementById("field-date");
  const c = roundActiveCandidate();
  if(nameF) nameF.oninput = ()=>{ c.name = nameF.value; scheduleSave(c); refreshCandidateList(); };
  if(regionF) regionF.oninput = ()=>{ c.region = regionF.value; scheduleSave(c); refreshCandidateList(); };
  if(dateF) dateF.oninput = ()=>{ c.date = dateF.value; scheduleSave(c); refreshCandidateList(); };

  const ptLinkF = document.getElementById("field-pt-link");
  if(ptLinkF){
    ptLinkF.oninput = ()=>{ c.ptProfileLink = ptLinkF.value; scheduleSave(c); };
    const finalizePtLink = ()=>{
      if((c.ptProfileLink||"").trim()){ ptEditing = false; render(); }
    };
    ptLinkF.onblur = finalizePtLink;
    ptLinkF.onkeydown = (ev)=>{ if(ev.key === "Enter"){ ev.preventDefault(); ptLinkF.blur(); } };
  }
  const ptClearBtn = document.getElementById("pt-clear-btn");
  if(ptClearBtn){
    ptClearBtn.onclick = ()=>{
      c.ptProfileLink = "";
      ptEditing = true;
      scheduleSave(c);
      render();
      setTimeout(()=>{ const f = document.getElementById("field-pt-link"); if(f) f.focus(); }, 30);
    };
  }

  const delBtn = document.getElementById("delete-btn");
  if(delBtn) delBtn.onclick = ()=>handleDeleteClick(delBtn);
  const printBtn = document.getElementById("print-btn");
  if(printBtn) printBtn.onclick = exportPrintable;

  document.querySelectorAll('[data-role="score"]').forEach(el=>{
    el.onclick = ()=>{
      const item = el.dataset.item, round = parseInt(el.dataset.round,10), score = parseFloat(el.dataset.score);
      const cand = roundActiveCandidate();
      const rd = cand[roundKey(round)];
      rd.scores[item] = score;
      delete rd.aiFields[item];
      scheduleSave(cand);
      render();
    };
  });

  document.querySelectorAll('[data-role="notes"]').forEach(el=>{
    el.oninput = ()=>{
      const item = el.dataset.item, round = parseInt(el.dataset.round,10);
      const cand = roundActiveCandidate();
      const rd = cand[roundKey(round)];
      rd.notes[item] = el.value;
      delete rd.aiFields[item];
      scheduleSave(cand);
    };
  });

  [1,2].forEach(n=>{
    const genBtn = document.getElementById("generate-btn-" + n);
    if(genBtn) genBtn.onclick = ()=>generateFromTranscript(n);
  });
}

function refreshCandidateList(){
  const listEl = document.getElementById("candidate-list");
  if(!listEl) return;
  listEl.innerHTML = renderCandidateCards();
  document.querySelectorAll(".cand-card").forEach(el=>{
    el.onclick = ()=>{ activeId = el.dataset.id; activeRound = 1; ptEditing = false; render(); };
  });
}

/* ============================================================
   CANDIDATE CRUD
   ============================================================ */
function createCandidate(){
  const c = blankCandidate();
  candidates.unshift(c);
  activeId = c.id;
  activeRound = 1;
  roundMode = {1:"manual",2:"manual"};
  saveIndex();
  scheduleSave(c);
  render();
  setTimeout(()=>{ const f = document.getElementById("field-name"); if(f) f.focus(); }, 30);
}

let deleteConfirmTimer = null;

function handleDeleteClick(btn){
  if(btn.dataset.confirming === "1"){
    clearTimeout(deleteConfirmTimer);
    deleteCandidate();
    return;
  }
  btn.dataset.confirming = "1";
  btn.classList.add("confirming");
  btn.textContent = "Click again to confirm";
  deleteConfirmTimer = setTimeout(()=>{
    btn.dataset.confirming = "0";
    btn.classList.remove("confirming");
    btn.textContent = "Delete candidate";
  }, 3500);
}

async function deleteCandidate(){
  const c = roundActiveCandidate();
  if(!c) return;
  const name = c.name || "This candidate";
  candidates = candidates.filter(x=>x.id!==c.id);
  activeId = candidates.length ? candidates[0].id : null;
  activeRound = 1;
  ptEditing = false;
  await saveIndex();
}

/* ============================================================
   BACKUP — export/import the whole roster as JSON
   (safety net in case a new share link starts with empty storage)
   ============================================================ */
function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), candidates: candidates };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "driver-scorecard-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

function handleImportFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.candidates;
      if(!Array.isArray(incoming)) throw new Error("File doesn't look like a scorecard backup.");
      const existingIds = new Set(candidates.map(c=>c.id));
      let added = 0, skipped = 0;
      for(const cand of incoming){
        if(!cand || !cand.id){ continue; }
        if(existingIds.has(cand.id)){ skipped++; continue; }
        candidates.push(cand);
        existingIds.add(cand.id);
        await window.storage.set("candidate:" + cand.id, JSON.stringify(cand), true);
        added++;
      }
      candidates.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      await saveIndex();
      render();
      showToast(`Imported ${added} candidate${added===1?"":"s"}.` + (skipped ? ` Skipped ${skipped} already in this roster.` : ""));
    }catch(e){
      showToast("Couldn't read that file — make sure it's a backup exported from this tool.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ============================================================
   AI GENERATION FROM TRANSCRIPT
   ============================================================ */
function buildRubricText(schema){
  const lines = [];
  schema.forEach(cat=>{
    lines.push("## " + cat.category);
    cat.items.forEach(it=>{
      if(it.freeOnly){
        lines.push(`- id:${it.id} | NOTES ONLY (no score) | "${it.q}"`);
      } else {
        const opts = it.options.map(o=>`${o.s}=${o.l}`).join(" ; ");
        lines.push(`- id:${it.id} | SCORE ONE OF [${opts}] | "${it.q}"`);
      }
    });
  });
  return lines.join("\n");
}

async function generateFromTranscript(roundNum){
  const cand = roundActiveCandidate();
  if(!cand) return;
  const transcriptEl = document.getElementById("transcript-input-" + roundNum);
  const contextEl = document.getElementById("context-input-" + roundNum);
  const transcript = (transcriptEl && transcriptEl.value.trim()) || "";
  const extraContext = (contextEl && contextEl.value.trim()) || "";

  if(!transcript){
    genState[roundNum] = { busy:false, error:"Paste a transcript first." };
    render();
    return;
  }

  genState[roundNum] = { busy:true, error:null };
  render();

  const schema = ROUND_META[roundNum].schema;
  const rubricText = buildRubricText(schema);
  const roundLabel = ROUND_META[roundNum].label;

  const systemPrompt = `You are helping a logistics company score a driver job interview transcript against a fixed rubric for "${roundLabel}".
For every rubric item with an id, decide a score (only from the listed allowed values) and write a short note (max 12 words) citing what the driver actually said. For NOTES ONLY items, leave score as null and just write a short note if the transcript covers it, or null note if it wasn't discussed.
If the transcript doesn't address an item, set score to null and note to null — never guess a score with no evidence.
Respond with STRICT JSON only, no markdown fences, no commentary, in exactly this shape:
{"summary":"one or two sentence overall read on the candidate","items":{"<id>":{"score":<number or null>,"note":"<short note or null>"}, ...}}
Include every id from the rubric below.

RUBRIC:
${rubricText}`;

  const userMsg = `TRANSCRIPT:\n${transcript}${extraContext ? `\n\nADDITIONAL CONTEXT FROM THE REGIONAL MANAGER:\n${extraContext}` : ""}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role:"user", content:userMsg }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==="text");
    if(!textBlock) throw new Error("No response text from model.");
    let clean = textBlock.text.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(clean);

    const rd = cand[roundKey(roundNum)];
    rd.aiSummary = parsed.summary || null;
    Object.entries(parsed.items || {}).forEach(([id, val])=>{
      if(val.score !== null && val.score !== undefined){
        rd.scores[id] = Number(val.score);
        rd.aiFields[id] = true;
      }
      if(val.note !== null && val.note !== undefined && val.note !== ""){
        rd.notes[id] = val.note;
        rd.aiFields[id] = true;
      }
    });

    genState[roundNum] = { busy:false, error:null };
    roundMode[roundNum] = "manual";
    scheduleSave(cand);
  }catch(e){
    genState[roundNum] = { busy:false, error:"Couldn't generate a scorecard from that transcript. Try again, or fill it in manually." };
  }
  render();
}

/* ============================================================
   LIVE SYNC — pick up teammates' changes without a manual reload
   ============================================================ */
let syncTimer = null;
let syncInFlight = false;

async function pollForUpdates(){
  if(syncInFlight) return;
  syncInFlight = true;
  try{
    const idx = await window.storage.get("candidate_index", true);
    const remoteIds = idx ? JSON.parse(idx.value) : [];
    const remoteSet = new Set(remoteIds);

    // Someone deleted a candidate elsewhere — drop it locally too.
    const hadActive = activeId;
    const activeStillExists = !activeId || remoteSet.has(activeId);
    const before = candidates.length;
    candidates = candidates.filter(c=>remoteSet.has(c.id));
    let rosterChanged = candidates.length !== before;

    for(const id of remoteIds){
      if(id === activeId) continue; // never silently overwrite what's open on screen
      try{
        const rec = await window.storage.get("candidate:" + id, true);
        if(!rec) continue;
        const remote = JSON.parse(rec.value);
        const i = candidates.findIndex(c=>c.id===id);
        if(i === -1){
          candidates.push(remote);
          rosterChanged = true;
        } else if((remote.updatedAt||0) > (candidates[i].updatedAt||0)){
          candidates[i] = remote;
          rosterChanged = true;
        }
      }catch(e){ /* skip this one, try again next poll */ }
    }
    candidates.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

    if(hadActive && !activeStillExists){
      activeId = candidates.length ? candidates[0].id : null;
      activeRound = 1;
      ptEditing = false;
      render();
      showToast("That candidate was deleted by a teammate.");
    } else if(hadActive){
      // Check whether the open candidate changed remotely without clobbering it.
      try{
        const rec = await window.storage.get("candidate:" + hadActive, true);
        if(rec){
          const remote = JSON.parse(rec.value);
          const local = candidates.find(c=>c.id===hadActive);
          if(local && (remote.updatedAt||0) > (local.updatedAt||0) + 1000){
            showToast("A teammate updated this candidate.", "Reload", ()=>{
              const li = candidates.findIndex(c=>c.id===hadActive);
              if(li !== -1) candidates[li] = remote;
              render();
            });
          }
        }
      }catch(e){}
      if(rosterChanged) refreshCandidateList();
    } else if(rosterChanged){
      refreshCandidateList();
    }
  }catch(e){ /* stay quiet — retry on the next tick */ }
  syncInFlight = false;
}

function startSync(){
  clearInterval(syncTimer);
  syncTimer = setInterval(pollForUpdates, 6000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") pollForUpdates();
  });
}

/* ============================================================
   INIT
   ============================================================ */
loadCandidates().then(startSync);
</script>
